<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Converter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #555;
    --success: #4ade80;
    --error: #f87171;
  }

  :root.light {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --border: #d8d8d0;
    --accent: #5a7a00;
    --accent2: #cc4400;
    --text: #1a1a1a;
    --muted: #888;
    --success: #2d8a50;
    --error: #c0392b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 40px 24px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  :root:not(.light) body::before {
    background-image:
      linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header { margin-bottom: 48px; }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(36px, 7vw, 64px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
    font-family: 'Space Mono', monospace;
  }

  .format-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .options-row {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .option-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .option-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .quality-slider {
    -webkit-appearance: none;
    width: 100px;
    height: 3px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  .quality-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 0;
    cursor: pointer;
  }

  .quality-value {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 28px;
  }

  .size-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    outline: none;
  }

  .size-select:focus { border-color: var(--accent); }

  .quality-group { transition: opacity 0.2s; }
  .quality-group.hidden { opacity: 0.3; pointer-events: none; }

  .toggle-group {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .toggle-box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 10px;
    color: #0a0a0a;
  }

  .toggle-box.checked { background: var(--accent); border-color: var(--accent); }

  .toggle-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.15s;
  }

  .toggle-group:hover .toggle-label { color: var(--text); }
  .toggle-group:hover .toggle-box { border-color: var(--accent); }

  .format-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .fmt-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 18px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
  }

  .fmt-btn:hover { border-color: var(--accent); color: var(--accent); }
  .fmt-btn.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-weight: 700; }

  .dropzone {
    border: 1.5px dashed var(--border);
    background: var(--surface);
    border-radius: 2px;
    padding: 56px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .dropzone::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(232,255,71,0.04) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: #141414; }
  .dropzone:hover::after, .dropzone.drag-over::after { opacity: 1; }

  .drop-icon {
    width: 48px; height: 48px;
    margin: 0 auto 16px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: border-color 0.2s;
  }

  .dropzone:hover .drop-icon { border-color: var(--accent); }

  .drop-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .drop-sub { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .drop-sub span { color: var(--accent); }

  input[type="file"] { display: none; }

  #file-list { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }

  .file-item {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    background: #1a1a1a;
    border: 1px solid var(--border);
    padding: 4px 6px;
    color: var(--accent2);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .file-name {
    flex: 1;
    font-size: 13px;
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-size { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); flex-shrink: 0; }

  .file-status { font-size: 14px; flex-shrink: 0; width: 22px; text-align: center; }

  .download-btn {
    background: none;
    border: 1px solid var(--success);
    color: var(--success);
    padding: 4px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    text-decoration: none;
    display: none;
  }

  .download-btn:hover { background: var(--success); color: #0a0a0a; }
  .download-btn.visible { display: inline-block; }

  .remove-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 0 4px;
    transition: color 0.15s; flex-shrink: 0;
  }
  .remove-btn:hover { color: var(--error); }

  .progress-bar-wrap { margin-top: 20px; display: none; }
  .progress-bar-wrap.visible { display: block; }

  .progress-labels {
    display: flex; justify-content: space-between;
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); margin-bottom: 8px;
  }

  .progress-track { height: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

  .actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-convert {
    background: var(--accent); color: #0a0a0a; border: none;
    padding: 14px 32px;
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: all 0.15s;
  }

  .btn-convert:hover { background: #d4eb3a; transform: translateY(-1px); }
  .btn-convert:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 14px 24px;
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer; transition: all 0.15s;
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-zip {
    background: none; border: 1px solid #7c3aed; color: #a78bfa;
    padding: 14px 24px;
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer; transition: all 0.15s;
    display: none;
  }

  .btn-zip:hover { background: #7c3aed; color: #fff; }
  .btn-zip.visible { display: inline-block; }

  .count-badge {
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); margin-left: auto;
  }

  #log {
    margin-top: 24px; background: #0d0d0d;
    border: 1px solid var(--border); padding: 16px;
    font-family: 'Space Mono', monospace; font-size: 11px;
    line-height: 1.8; max-height: 200px; overflow-y: auto; display: none;
  }

  #log.visible { display: block; }
  .log-success { color: var(--success); }
  .log-error { color: var(--error); }
  .log-info { color: var(--muted); }
  .log-done { color: var(--accent); font-weight: 700; }

  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: #0d0d0d; }
  #log::-webkit-scrollbar-thumb { background: var(--border); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin 1s linear infinite; }

  .theme-btn {
    position: fixed;
    top: 20px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    z-index: 100;
  }

  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  .server-status {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); margin-bottom: 20px;
  }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background 0.3s;
  }

  .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.offline { background: var(--error); }
</style>
</head>
<body>
<button class="theme-btn" id="theme-btn">&#9728; Light</button>
<div class="container">
  <header>
    <div class="tag">// image converter</div>
    <h1>Image<br><span>Converter</span></h1>
    <p class="subtitle">batch convert heic / png / jpeg &rarr; png / jpeg / webp</p>
  </header>

  <div class="server-status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Checking server...</span>
  </div>

  <div class="format-row">
    <span class="format-label">Output &rarr;</span>
    <button class="fmt-btn active" data-fmt="PNG">PNG</button>
    <button class="fmt-btn" data-fmt="JPEG">JPEG</button>
    <button class="fmt-btn" data-fmt="WEBP">WEBP</button>
  </div>

  <div class="options-row">
    <div class="option-group quality-group" id="quality-group">
      <span class="option-label">Quality &rarr;</span>
      <input type="range" class="quality-slider" id="quality-slider" min="1" max="100" value="85">
      <span class="quality-value" id="quality-value">85</span>
    </div>
    <div class="option-group">
      <span class="option-label">Max size &rarr;</span>
      <select class="size-select" id="max-size">
        <option value="0">Original</option>
        <option value="3840">4K (3840px)</option>
        <option value="2048">2K (2048px)</option>
        <option value="1920" selected>1920px</option>
        <option value="1280">1280px</option>
        <option value="800">800px</option>
      </select>
    </div>
    <div class="option-group">
      <label class="toggle-group" id="pad-toggle">
        <div class="toggle-box" id="pad-box">&#10003;</div>
        <span class="toggle-label">Pad to 4:3</span>
      </label>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <div class="drop-icon">&#128193;</div>
    <div class="drop-title">Drop images here</div>
    <div class="drop-sub">HEIC, PNG, JPEG &mdash; or <span>click to browse</span> &mdash; multiple files supported</div>
    <input type="file" id="file-input" accept=".heic,.HEIC,.png,.PNG,.jpg,.JPG,.jpeg,.JPEG" multiple>
  </div>

  <div id="file-list"></div>

  <div class="progress-bar-wrap" id="progress-wrap">
    <div class="progress-labels">
      <span id="progress-label">Converting...</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-convert" id="convert-btn" disabled>Convert All</button>
    <button class="btn-secondary" id="clear-btn">Clear</button>
    <button class="btn-zip" id="zip-btn">&#8595; Download ZIP</button>
    <span class="count-badge" id="count-badge"></span>
  </div>

  <div id="log"></div>
</div>

<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const fileList = document.getElementById('file-list');
  const convertBtn = document.getElementById('convert-btn');
  const clearBtn = document.getElementById('clear-btn');
  const zipBtn = document.getElementById('zip-btn');
  const countBadge = document.getElementById('count-badge');
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');
  const progressPct = document.getElementById('progress-pct');
  const log = document.getElementById('log');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  let files = []; // { file, name, size, status, objectUrl, outputName }
  let selectedFormat = 'PNG';

  const qualitySlider = document.getElementById('quality-slider');
  const qualityValue = document.getElementById('quality-value');
  const maxSizeSelect = document.getElementById('max-size');
  const qualityGroup = document.getElementById('quality-group');
  const padToggle = document.getElementById('pad-toggle');
  const padBox = document.getElementById('pad-box');
  let padEnabled = false;

  qualitySlider.addEventListener('input', () => {
    qualityValue.textContent = qualitySlider.value;
  });

  padToggle.addEventListener('click', () => {
    padEnabled = !padEnabled;
    padBox.classList.toggle('checked', padEnabled);
  });

  qualityGroup.classList.add('hidden');

  // --- Server ping ---
  async function pingServer() {
    try {
      const res = await fetch('/health', { signal: AbortSignal.timeout(2000) });
      if (res.ok) {
        statusDot.className = 'status-dot online';
        statusText.textContent = window.location.hostname === 'localhost'
          ? 'Server online \xB7 localhost:3000'
          : 'Server online \xB7 ' + window.location.hostname;
      }
    } catch {
      statusDot.className = 'status-dot offline';
      statusText.textContent = 'Server offline \u2014 run: node server.js';
    }
  }

  pingServer();
  setInterval(pingServer, 5000);

  // --- Format buttons ---
  document.querySelectorAll('.fmt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedFormat = btn.dataset.fmt;
      qualityGroup.classList.toggle('hidden', selectedFormat === 'PNG');
    });
  });

  // --- Drag & drop ---
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    addFiles([...e.dataTransfer.files].filter(f => /\.(heic|png|jpe?g)$/i.test(f.name)));
  });

  fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function addFiles(newFiles) {
    newFiles.forEach(f => {
      if (!files.find(x => x.name === f.name && x.size === f.size))
        files.push({ file: f, name: f.name, size: f.size, status: 'pending', objectUrl: null, outputName: null });
    });
    renderList();
  }

  function statusIcon(f) {
    if (f.status === 'pending') return '\u25CB';
    if (f.status === 'converting') return '<span class="spinning">\u25CC</span>';
    if (f.status === 'done') return '<span style="color:var(--success)">\u2713</span>';
    if (f.status === 'error') return '<span style="color:var(--error)">\u2715</span>';
    return '';
  }

  function renderList() {
    fileList.innerHTML = '';
    files.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      const inputExt = f.name.split('.').pop().toUpperCase();
      item.innerHTML = `
        <span class="file-badge">${inputExt}</span>
        <span class="file-name">${f.name}</span>
        <span class="file-size">${formatSize(f.size)}</span>
        <span class="file-status">${statusIcon(f)}</span>
        ${f.objectUrl
          ? `<a class="download-btn visible" href="${f.objectUrl}" download="${f.outputName}">\u2193 save</a>`
          : '<span class="download-btn"></span>'}
        <button class="remove-btn" data-i="${i}">&times;</button>
      `;
      fileList.appendChild(item);
    });

    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = +btn.dataset.i;
        if (files[i].objectUrl) URL.revokeObjectURL(files[i].objectUrl);
        files.splice(i, 1);
        renderList();
      });
    });

    const n = files.length;
    countBadge.textContent = n > 0 ? `${n} file${n > 1 ? 's' : ''} queued` : '';
    convertBtn.disabled = n === 0;
  }

  function addLog(msg, type = 'info') {
    log.classList.add('visible');
    const line = document.createElement('div');
    line.className = `log-${type}`;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  // --- Convert (per-file, synchronous requests) ---
  convertBtn.addEventListener('click', async () => {
    if (!files.length) return;

    convertBtn.disabled = true;
    clearBtn.disabled = true;
    zipBtn.classList.remove('visible');
    progressWrap.classList.add('visible');
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    log.innerHTML = '';
    log.classList.add('visible');

    // Reset state for re-convert
    files.forEach(f => {
      f.status = 'pending';
      if (f.objectUrl) { URL.revokeObjectURL(f.objectUrl); f.objectUrl = null; }
      f.outputName = null;
    });

    addLog(`[START] Converting ${files.length} file(s) to ${selectedFormat}...`, 'info');

    let done = 0;
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      files[i].status = 'converting';
      renderList();

      const formData = new FormData();
      formData.append('file', f.file);
      formData.append('format', selectedFormat);
      formData.append('quality', qualitySlider.value);
      formData.append('max_size', maxSizeSelect.value);
      formData.append('pad', padEnabled);

      try {
        const res = await fetch('/api/convert', { method: 'POST', body: formData });
        if (!res.ok) {
          const data = await res.json().catch(() => ({ error: 'Unknown error' }));
          files[i].status = 'error';
          addLog(`\u2715  ${f.name}  \u2192  ${data.error}`, 'error');
        } else {
          const blob = await res.blob();
          const cd = res.headers.get('Content-Disposition') || '';
          const match = cd.match(/filename="([^"]+)"/);
          const ext = selectedFormat === 'JPEG' ? 'jpg' : selectedFormat.toLowerCase();
          files[i].outputName = match ? match[1] : f.name.replace(/\.[^.]+$/, '.' + ext);
          files[i].objectUrl = URL.createObjectURL(blob);
          files[i].status = 'done';
          addLog(`\u2713  ${f.name}  \u2192  ${files[i].outputName}`, 'success');
        }
      } catch {
        files[i].status = 'error';
        addLog(`\u2715  ${f.name}  \u2192  Network error`, 'error');
      }

      done++;
      const pct = Math.round((done / files.length) * 100);
      progressFill.style.width = pct + '%';
      progressPct.textContent = pct + '%';
      progressLabel.textContent = f.name;
      renderList();
    }

    const successCount = files.filter(f => f.status === 'done').length;
    const failCount = files.filter(f => f.status === 'error').length;
    progressLabel.textContent = 'Done';
    addLog('', 'info');
    addLog(`[DONE]  ${successCount} converted \xB7 ${failCount} failed`, 'done');

    if (successCount > 1) zipBtn.classList.add('visible');
    convertBtn.disabled = false;
    clearBtn.disabled = false;
    renderList();
  });

  // --- Download ZIP (client-side via JSZip) ---
  zipBtn.addEventListener('click', async () => {
    const done = files.filter(f => f.status === 'done' && f.objectUrl);
    if (!done.length) return;

    zipBtn.textContent = 'Zipping...';
    zipBtn.disabled = true;

    const zip = new JSZip();
    for (const f of done) {
      const resp = await fetch(f.objectUrl);
      const blob = await resp.blob();
      zip.file(f.outputName, blob);
    }

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'converted_images.zip';
    a.click();
    URL.revokeObjectURL(url);

    zipBtn.textContent = '\u2193 Download ZIP';
    zipBtn.disabled = false;
  });

  // --- Theme toggle ---
  const themeBtn = document.getElementById('theme-btn');
  const root = document.documentElement;
  themeBtn.addEventListener('click', () => {
    const isLight = root.classList.toggle('light');
    themeBtn.textContent = isLight ? '\u263E Dark' : '\u2600 Light';
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
  });
  if (localStorage.getItem('theme') === 'light') {
    root.classList.add('light');
    themeBtn.textContent = '\u263E Dark';
  }

  // --- Clear ---
  clearBtn.addEventListener('click', () => {
    files.forEach(f => { if (f.objectUrl) URL.revokeObjectURL(f.objectUrl); });
    files = [];
    renderList();
    progressWrap.classList.remove('visible');
    progressFill.style.width = '0%';
    log.classList.remove('visible');
    log.innerHTML = '';
    zipBtn.classList.remove('visible');
  });
</script>
</body>
</html>
